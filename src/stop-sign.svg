<svg width="60" height="60" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>stop-sign.svg</title>
  <desc>Small red octagon stop sign</desc>

  <!-- Octagon -->
  <polygon 
    points="30,10 90,10 110,30 110,90 90,110 30,110 10,90 10,30"
    fill="#d40000"
    stroke="#ffffff"
    stroke-width="6"
  />

  <!-- STOP text -->
  <text 
    x="60" 
    y="72" 
    font-size="32" 
    font-family="Arial" 
    font-weight="bold" 
    fill="#ffffff" 
    text-anchor="middle">
    STOP
  </text>
</svg>
